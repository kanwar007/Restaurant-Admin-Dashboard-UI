apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-admin-mock-api
  namespace: cafe-admin
  labels:
    app.kubernetes.io/name: cafe-admin
    app.kubernetes.io/component: mock-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-admin
      app.kubernetes.io/component: mock-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-admin
        app.kubernetes.io/component: mock-api
    spec:
      containers:
        - name: mock-api
          image: ACRNAME.azurecr.io/cafe-admin-mock-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MOCK_LATENCY_MS
              value: "120"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-admin-mock-api
  namespace: cafe-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cafe-admin
    app.kubernetes.io/component: mock-api
  ports:
    - name: http
      port: 4000
      targetPort: http
