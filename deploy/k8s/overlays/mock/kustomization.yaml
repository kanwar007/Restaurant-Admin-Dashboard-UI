apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Demo overlay: runs the in-memory mock API instead of the Spring Boot backend.
namespace: cafe-admin

resources:
  - ../../base
  - mock-api.yaml

images:
  - name: ACRNAME.azurecr.io/cafe-admin-mock-api
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: cafe-admin-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://cafe-admin-mock-api:4000
