apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cafe-admin

resources:
  - namespace.yaml
  - mock-api.yaml
  - web.yaml
  - hpa.yaml

# Point these at your Azure Container Registry, e.g.
#   kustomize edit set image ACRNAME.azurecr.io/cafe-admin-web=myacr.azurecr.io/cafe-admin-web:v1
images:
  - name: ACRNAME.azurecr.io/cafe-admin-web
    newTag: latest
  - name: ACRNAME.azurecr.io/cafe-admin-mock-api
    newTag: latest
