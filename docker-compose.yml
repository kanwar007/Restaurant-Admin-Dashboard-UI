services:
  # Opt-in offline backend: docker compose --profile mock up --build
  mock-api:
    profiles: ["mock"]
    build: ./mock-api
    ports:
      - "4000:4000"

  web:
    build: ./web
    environment:
      # Defaults to the real backend (Restaurant-Admin-Dashboard-BackEnd) published on the host at :4000.
      # With the mock profile: API_UPSTREAM=http://mock-api:4000 docker compose --profile mock up --build
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
